<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSL Asphalt Sales | August 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:24px}
.title-bar{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:12px;padding:20px 24px;margin-bottom:20px}
.title-bar h1{font-size:1.2rem;font-weight:700;color:#f8fafc}
.title-bar .sub{color:#94a3b8;font-size:0.8rem;margin-top:4px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.chip{background:#1e293b;border-radius:10px;padding:16px;border:1px solid #334155}
.chip label{font-size:0.65rem;text-transform:uppercase;color:#94a3b8;letter-spacing:0.05em;margin-bottom:6px;font-weight:600;display:block}
.chip .val{font-size:1.3rem;font-weight:800;color:#f8fafc}
.chip .sub{font-size:0.72rem;color:#64748b;margin-top:3px}
.chip.blue{border-top:3px solid #3b82f6}
.chip.green{border-top:3px solid #10b981}
.chip.orange{border-top:3px solid #f59e0b}
.chip.violet{border-top:3px solid #8b5cf6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.box{background:#1e293b;border-radius:10px;padding:20px;border:1px solid #334155}
.box h3{font-size:0.8rem;color:#94a3b8;margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.bar{position:relative;height:28px;background:#0f172a;border-radius:6px;margin-bottom:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;transition:width 0.4s}
.bar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:0.75rem;font-weight:600;color:#e2e8f0;z-index:1}
.bar .txt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid #334155;font-size:0.8rem}
th{color:#94a3b8;font-weight:600;text-transform:uppercase;font-size:0.65rem;letter-spacing:0.04em}
th:first-child,td:first-child{text-align:left}
tr:hover{background:rgba(59,130,246,0.06)}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:#34d399}
.rank{display:inline-block;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-size:0.75rem;font-weight:700;margin-right:6px}
.rank.gold{background:#f59e0b;color:#0f172a}
.rank.silver{background:#94a3b8;color:#0f172a}
.rank.bronze{background:#d97706;color:#fff}
.note{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:8px;padding:10px 16px;margin-bottom:20px;font-size:0.8rem;color:#fbbf24}
</style>
</head>
<body>
<div class="container">
<div class="title-bar">
<h1>ABSL Asphalt Sales Dashboard</h1>
<div class="sub">Akij Building Solutions Limited — August 2026 (MTD: Aug 1-11) — Source: Sales Invoices (iBOS ERP)</div>
</div>

<div class="note" id="note"></div>

<div class="chips" id="chips"></div>

<div class="row">
<div class="box">
<h3>Daily Invoice Trend</h3>
<div id="dailyBars"></div>
</div>
<div class="box">
<h3>Sales Person Performance</h3>
<div id="personBars"></div>
</div>
</div>

<div class="box">
<h3>Sales Persons Ranking</h3>
<table><thead><tr><th>Rank</th><th>Sales Person</th><th>Role</th><th>Invoices</th><th>Total Qty</th><th>Share %</th><th>Avg Qty/Invoice</th></tr></thead><tbody id="personTable"></tbody></table>
</div>
</div>

<script>
function fm(n){return (n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function fmd(n){return (n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}

async function load(){
const d=await fetch('/api/absl-asphalt-august-2026').then(r=>r.json());

document.getElementById('note').innerHTML='<strong>Data Source:</strong> Sales Invoices (tblSalesInvoiceArc.strSoldByName). Mizan did not appear in ABSL asphalt invoice data for Aug 2026.';

const c=[];
c.push('<div class="chip green"><label>Total Invoices (MTD)</label><div class="val">'+fm(d.totalInvoices)+'</div><div class="sub">'+d.salesPersons+' sales persons</div></div>');
c.push('<div class="chip blue"><label>Total Quantity</label><div class="val">'+fmd(d.totalQty)+'</div><div class="sub">Tonnes / Units</div></div>');
c.push('<div class="chip orange"><label>Avg Per Invoice</label><div class="val">'+fmd(d.totalInvoices>0?d.totalQty/d.totalInvoices:0)+'</div><div class="sub">Qty per invoice</div></div>');
c.push('<div class="chip violet"><label>Top Performer</label><div class="val" style="font-size:0.95rem">Moazzem Hossain</div><div class="sub">'+fm(d.persons[0].qty)+' qty / '+d.persons[0].txns+' invoices</div></div>');
document.getElementById('chips').innerHTML=c.join('');

const maxD=Math.max(...d.daily.map(x=>x.qty));
document.getElementById('dailyBars').innerHTML=d.daily.map(day=>{
const w=Math.round(day.qty/maxD*100);
return '<div class="bar"><div class="fill" style="width:'+w+'%;background:linear-gradient(90deg,#10b981,#34d399)"></div><div class="txt"><span>Aug '+day.date.substring(8)+'</span><span>'+fmd(day.qty)+' qty ('+day.cnt+' inv)</span></div></div>';
}).join('');

document.getElementById('personBars').innerHTML=d.persons.map((p,i)=>{
const w=Math.round(p.qty/d.persons[0].qty*100);
const cols=['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444'];
return '<div class="bar"><div class="fill" style="width:'+w+'%;background:'+cols[i]+'"></div><div class="txt"><span><b>'+(i+1)+'.</b> '+p.name+'</span><span>'+fmd(p.qty)+' qty ('+p.txns+' inv)</span></div></div>';
}).join('');

document.getElementById('personTable').innerHTML=d.persons.map(p=>{
const rk=p.rank===1?'gold':p.rank===2?'silver':p.rank===3?'bronze':'';
return '<tr>'+
'<td><span class="rank '+rk+'">'+p.rank+'</span></td>'+
'<td style="font-weight:600">'+p.name+'</td>'+
'<td style="font-size:0.75rem;color:#94a3b8">'+p.role+'</td>'+
'<td class="num">'+p.txns+'</td>'+
'<td class="num pos">'+fmd(p.qty)+'</td>'+
'<td class="num">'+((p.qty/d.totalQty)*100).toFixed(1)+'%</td>'+
'<td class="num">'+fmd(p.txns>0?p.qty/p.txns:0)+'</td>'+
'</tr>';
}).join('');
}

load();
</script>
</body>
</html>
