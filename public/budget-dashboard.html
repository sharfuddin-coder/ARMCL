<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Dashboard | August' 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
.container{max-width:1500px;margin:0 auto;padding:24px}
.title-bar{background:#0f172a;color:#f8fafc;border-radius:12px;padding:20px 24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.title-bar h1{font-size:1.15rem;font-weight:700}
.title-bar .date{color:#94a3b8;font-size:0.85rem}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.chip{background:#fff;border-radius:10px;padding:14px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.chip label{font-size:0.68rem;text-transform:uppercase;color:#64748b;letter-spacing:0.06em;display:block;margin-bottom:6px;font-weight:600}
.chip .val{font-size:1.5rem;font-weight:800;color:#0f172a}
.chip .extra{font-size:0.75rem;color:#64748b;margin-top:4px}
.chip.blue{border-top:3px solid #3b82f6}
.chip.green{border-top:3px solid #10b981}
.chip.orange{border-top:3px solid #f59e0b}
.chip.red{border-top:3px solid #ef4444}
.chip.violet{border-top:3px solid #8b5cf6}
.table-box{background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,0.05);overflow:hidden}
.table-box .tb-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0}
.table-box .tb-head h3{font-size:0.95rem;font-weight:700;color:#0f172a}
.table-box .tb-head .meta{font-size:0.75rem;color:#64748b}
.table-scroll{overflow-x:auto;max-height:700px;overflow-y:auto}
table{width:100%;border-collapse:collapse;min-width:1200px}
thead{position:sticky;top:0;background:#f8fafc;z-index:2}
th{font-size:0.66rem;text-transform:uppercase;color:#64748b;letter-spacing:0.05em;padding:12px 14px;text-align:right;border-bottom:2px solid #e2e8f0;white-space:nowrap;font-weight:700}
th:first-child,td:first-child{text-align:left}
td{padding:11px 14px;font-size:0.8rem;border-bottom:1px solid #f1f5f9;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover{background:#f8fafc}
tr:nth-child(even){background:#fcfdff}
.num{font-weight:600}
.pos{color:#059669}
.neg{color:#dc2626}
.pct-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.72rem;font-weight:700}
.pct-badge.high{background:#dcfce7;color:#15803d}
.pct-badge.mid{background:#fef3c7;color:#b45309}
.pct-badge.low{background:#fee2e2;color:#b91c1c}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot-green{background:#10b981}
.dot-orange{background:#f59e0b}
.dot-red{background:#ef4444}
.loading,.error{text-align:center;padding:60px;color:#64748b;font-size:0.9rem}
.error{color:#dc2626}
</style>
</head>
<body>
<div class="container">
<div class="title-bar">
<div>
<h1>Budget Dashboard | August' 2026</h1>
<div class="sub" id="subtitle">Loading data...</div>
</div>
<div class="date" id="dateLabel">Date: --/--/--</div>
</div>

<div class="chips" id="chips"></div>

<div class="table-box">
<div class="tb-head">
<h3>Budget vs Actual Summary</h3>
<span class="meta" id="tableMeta"></span>
</div>
<div class="table-scroll">
<table>
<thead>
<tr>
<th>#</th><th>Category</th><th>Budget</th><th>Actual</th><th>Variance</th><th>Variance %</th><th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>

<div class="foot" id="foot"></div>

<script>
const BASE='';

function fmt(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function pct(n){return Number(n||0).toFixed(0)+'%'}
function statusBadge(p){
  if(p>=32)return '<span class="pct-badge high">On Track</span>';
  if(p>=20)return '<span class="pct-badge mid">Behind</span>';
  return '<span class="pct-badge low">Off Track</span>';
}
function statusDot(p){
  if(p>=32)return '<span class="status-dot dot-green"></span>On Track';
  if(p>=20)return '<span class="status-dot dot-orange"></span>Behind';
  return '<span class="status-dot dot-red"></span>Off Track';
}

async function load(){
  try{
    const d=await fetch(BASE+'/api/budget-dashboard').then(r=>r.json());
    renderChips(d);
    renderTable(d);
    document.getElementById('dateLabel').textContent='Date: 18/08/26';
  }catch(e){
    document.getElementById('subtitle').textContent='Failed to load: '+e.message;
    document.getElementById('chips').innerHTML='<div class="error">Error loading data</div>';
  }
}

function renderChips(d){
  const s=d;
  const c=[];
  c.push('<div class="chip blue"><label>Total Budget</label><div class="val">'+fmt(s.totalTarget)+'</div><div class="extra">Target for month</div></div>');
  c.push('<div class="chip green"><label>Actual Sales</label><div class="val">'+fmt(s.totalSales)+'</div><div class="extra">Sales Till Date</div></div>');
  c.push('<div class="chip orange"><label>Variance</label><div class="val '+(s.remainingSales>=0?'neg':'pos')+'">'+fmt(s.remainingSales)+'</div><div class="extra">Remaining</div></div>');
  c.push('<div class="chip violet"><label>Achievement</label><div class="val">'+pct(s.achievementPct)+'</div><div class="extra">of target met</div></div>');
  c.push('<div class="chip red"><label>RADS</label><div class="val">'+fmt(s.rads)+'</div><div class="extra">Needed per day</div></div>');
  document.getElementById('chips').innerHTML=c.join('');
  document.getElementById('tableMeta').textContent=' '+s.employees+' employees';
}

function renderTable(d){
  const tb=document.getElementById('tbody');
  tb.innerHTML='';
  // we'll show overall summary row only; could expand with per-employee later
  tb.innerHTML=
    '<tr>'+
    '<td colspan="7">'+
    '<strong>Budget vs Actual Summary</strong><br/>'+
    'Total Budget: '+fmt(d.totalTarget)+'<br/>'+
    'Actual (Sales Till Date): '+fmt(d.totalSales)+'<br/>'+
    'Achievement: '+pct(d.achievementPct)+'<br/>'+
    'Logical Achievement: '+pct(d.logicalAchivPct)+'<br/>'+
    'Remaining: '+fmt(d.remainingSales)+'<br/>'+
    'RADS (per day): '+fmt(d.rads)+
    '</td>'+
    '</tr>';
}

function renderFoot(d){
  const f=[];
  f.push('<div class="box"><label>Target</label><div class="val">'+fmt(d.totalTarget)+'</div></div>');
  f.push('<div class="box"><label>Actual</label><div class="val">'+fmt(d.totalSales)+'</div></div>');
  f.push('<div class="box"><label>Variance</label><div class="val '+(d.remainingSales>=0?'neg':'pos')+'">'+fmt(d.remainingSales)+'</div></div>');
  f.push('<div class="box"><label>RADS</label><div class="val">'+fmt(d.rads)+'</div></div>');
  document.getElementById('foot').innerHTML=f.join('');
}

load();
</script>
</body>
</html>
